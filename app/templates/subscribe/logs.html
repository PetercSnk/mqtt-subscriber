{% extends "base.html" %}
{% block content %}
<div class="row">

        <div class="link-container">
            {% for id in ids %}
                <a class="link logs" href="{{ url_for('subscribe.logs', id=id) }}">{{ id }}</a>
            {% endfor %}
        </div>
        <pre>{{ content }}</pre>
    </div>
</div>
{% endblock %}
